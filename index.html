<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f0e8" />
    <title>Wahlassistent</title>
    <link rel="stylesheet" href="styles.css" />
    <!--
      Die Anwendung laedt zur Laufzeit nichts aus dem Netz. pdf.js kommt lokal aus
      node_modules; ohne diese Zuordnung wuerde es still auf ein CDN ausweichen.
    -->
    <script type="importmap">
      {
        "imports": {
          "pdfjs-dist": "./node_modules/pdfjs-dist/build/pdf.min.mjs"
        }
      }
    </script>
  </head>
  <body>
    <main class="app">
      <section class="intro">
        <span class="eyebrow">Auszählung</span>
        <h1>Wahl<br />assistent.</h1>
        <p>
          Stimmzettel fotografieren, Markierungen prüfen lassen, Zweifelsfälle dem Wahlvorstand
          vorlegen. Das Papier bleibt das Original.
        </p>
      </section>

      <!-- Erfassen: Aufnahme eines ausgefuellten Zettels. Die Zettelart steht in konfiguration.js. -->
      <section class="karte" id="ansichtErfassen">
        <div class="preview">
          <div class="placeholder" id="erfassenPlatzhalter">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M8.5 6.5 10 4h4l1.5 2.5H19A2.5 2.5 0 0 1 21.5 9v8A2.5 2.5 0 0 1 19 19.5H5A2.5 2.5 0 0 1 2.5 17V9A2.5 2.5 0 0 1 5 6.5h3.5Z" />
              <circle cx="12" cy="13" r="3.5" />
            </svg>
            <span id="erfassenPlatzhalterText">Noch kein Stimmzettel erfasst</span>
          </div>
          <canvas id="erfassenBild" hidden></canvas>
        </div>

        <div class="actions">
          <p class="wertung" id="wertung" aria-live="polite" hidden></p>

          <button class="knopf" id="erfassenKnopf" type="button">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M8.5 6.5 10 4h4l1.5 2.5H19A2.5 2.5 0 0 1 21.5 9v8A2.5 2.5 0 0 1 19 19.5H5A2.5 2.5 0 0 1 2.5 17V9A2.5 2.5 0 0 1 5 6.5h3.5Z" />
              <circle cx="12" cy="13" r="3.5" />
            </svg>
            <span id="erfassenKnopfText">Stimmzettel aufnehmen</span>
          </button>
          <input id="erfassenEingabe" class="visually-hidden" type="file" accept="image/*,application/pdf" capture="environment" aria-label="Stimmzettel aufnehmen" />
          <p class="status" id="erfassenStatus">Aufnahmen bleiben auf diesem Gerät.</p>
        </div>
      </section>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
