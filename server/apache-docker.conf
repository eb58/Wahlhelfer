# Das Projekt liegt schreibgeschuetzt unter /srv/wahlassistent. Wie beim Hoster: Frontend im
# Webroot, API daneben unter /php-api; die API findet configuration.js und Wahlen/
# im Projektordner ueber sich.
<VirtualHost *:80>
    DocumentRoot /srv/wahlassistent/dist
    Alias /php-api /srv/wahlassistent/server

    <Directory /srv/wahlassistent/dist>
        AllowOverride None
        Require all granted
        Options -Indexes
    </Directory>

    # php-api/.htaccess braucht FileInfo (Rewrite, SetEnvIf) und AuthConfig.
    <Directory /srv/wahlassistent/server>
        AllowOverride FileInfo AuthConfig
        Require all granted
        Options -Indexes
    </Directory>

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
</VirtualHost>
